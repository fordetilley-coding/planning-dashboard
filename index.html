<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Project Viewer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="container">
    <h1>Local Project Viwer</h1>
    <p id="currentDate"></p>
  </div>
</header>

  <main class="container">

    <div class="dashboard">

      <!-- TASKS -->

      <section class="card">

        <h2>Tasks</h2>

        <div class="task-form">

          <input
            id="taskInput"
            type="text"
            placeholder="What needs to be done?"
          >

          <input
            id="taskDate"
            type="date"
          >

          <select id="taskPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>

        </div>

        <button
          class="primary-button"
          onclick="addTask()"
        >
          Add Task
        </button>

        <div class="filters">

          <button
            class="filter-button active"
            onclick="setFilter('today')"
            id="todayFilter"
          >
            Today
          </button>

          <button
            class="filter-button"
            onclick="setFilter('upcoming')"
            id="upcomingFilter"
          >
            Upcoming
          </button>

          <button
            class="filter-button"
            onclick="setFilter('all')"
            id="allFilter"
          >
            All
          </button>

        </div>

        <div id="taskList"></div>

      </section>


      <!-- NOTES -->

      <section class="card">

        <h2>Notes</h2>

        <textarea
          id="notes"
          placeholder="Write anything here..."
        ></textarea>

        <div
          class="save-message"
          id="saveMessage"
        >
          Auto-saving...
        </div>

      </section>

    </div>

  </main>

  <script src="app.js"></script>

</body>
</html>

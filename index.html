<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Planning Dashboard — manage tasks, notes, events, and reminders in one place."
  >

  <title>Planning Dashboard</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="app-header">

    <div class="container">

      <h1>Planning Dashboard</h1>

      <p id="currentDate">
        Loading date...
      </p>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="container">


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav
      class="main-navigation"
      aria-label="Main navigation"
    >

      <div class="nav-links">

        <button
          type="button"
          class="nav-button active"
          data-view="tasks"
          onclick="showView('tasks')"
        >
          Tasks
        </button>

        <button
          type="button"
          class="nav-button"
          data-view="notes"
          onclick="showView('notes')"
        >
          Notes
        </button>

        <button
          type="button"
          class="nav-button"
          data-view="events"
          onclick="showView('events')"
        >
          Events
        </button>

        <button
          type="button"
          class="nav-button"
          data-view="reminders"
          onclick="showView('reminders')"
        >
          Reminders
        </button>

      </div>


      <button
        type="button"
        class="quick-add-button"
        id="quickAddButton"
        onclick="focusQuickAdd()"
      >
        + Add Task
      </button>

    </nav>


    <!-- =========================
         TASKS
    ========================== -->

    <section
      id="tasksView"
      class="app-view active"
    >

      <div class="card">

        <h2>Tasks</h2>


        <div class="task-form">

          <input
            id="taskInput"
            type="text"
            placeholder="What needs to be done?"
            autocomplete="off"
          >

          <input
            id="taskDate"
            type="date"
          >

          <select id="taskPriority">

            <option value="low">
              Low
            </option>

            <option
              value="medium"
              selected
            >
              Medium
            </option>

            <option value="high">
              High
            </option>

          </select>

        </div>


        <button
          type="button"
          class="primary-button"
          onclick="addTask()"
        >
          Add Task
        </button>


        <div class="filters">

          <button
            type="button"
            class="filter-button active"
            id="todayFilter"
            onclick="setFilter('today')"
          >
            Today
          </button>

          <button
            type="button"
            class="filter-button"
            id="upcomingFilter"
            onclick="setFilter('upcoming')"
          >
            Upcoming
          </button>

          <button
            type="button"
            class="filter-button"
            id="allFilter"
            onclick="setFilter('all')"
          >
            All
          </button>

        </div>


        <div id="taskList"></div>

      </div>

    </section>


    <!-- =========================
         NOTES
    ========================== -->

    <section
      id="notesView"
      class="app-view"
    >

      <div class="card notes-container">

        <h2>Notes</h2>

        <textarea
          id="notes"
          placeholder="Write anything here..."
        ></textarea>

        <div
          class="save-message"
          id="saveMessage"
        >
          Saved
        </div>

      </div>

    </section>


    <!-- =========================
         EVENTS
    ========================== -->

    <section
      id="eventsView"
      class="app-view"
    >


      <!-- EVENT FORM -->

      <div
        class="card form-card"
        id="eventFormCard"
        hidden
      >

        <h2>Add Event</h2>


        <form
          id="eventForm"
          onsubmit="event.preventDefault(); addEvent();"
        >

          <div class="form-grid">


            <div class="form-group">

              <label for="eventTitle">
                Event
              </label>

              <input
                id="eventTitle"
                type="text"
                placeholder="Event name"
                required
              >

            </div>


            <div class="form-group">

              <label for="eventDate">
                Date
              </label>

              <input
                id="eventDate"
                type="date"
                required
              >

            </div>


            <div class="form-group">

              <label for="eventStartTime">
                Start
              </label>

              <input
                id="eventStartTime"
                type="time"
              >

            </div>


            <div class="form-group">

              <label for="eventEndTime">
                End
              </label>

              <input
                id="eventEndTime"
                type="time"
              >

            </div>


            <div class="form-group full-width">

              <label for="eventDescription">
                Description
              </label>

              <textarea
                id="eventDescription"
                placeholder="Optional description..."
                rows="4"
              ></textarea>

            </div>

          </div>


          <div class="form-actions">

            <button
              type="submit"
              class="primary-button"
            >
              Add Event
            </button>

            <button
              type="button"
              class="secondary-button"
              onclick="hideEventForm()"
            >
              Cancel
            </button>

          </div>

        </form>

      </div>


      <!-- EVENT LIST -->

      <div class="card">

        <div class="section-header">

          <h2>Events</h2>

          <button
            type="button"
            class="section-action"
            onclick="showEventForm()"
          >
            + Add Event
          </button>

        </div>

        <div
          id="eventList"
          class="event-list"
        ></div>

      </div>

    </section>


    <!-- =========================
         REMINDERS
    ========================== -->

    <section
      id="remindersView"
      class="app-view"
    >


      <!-- REMINDER FORM -->

      <div
        class="card form-card"
        id="reminderFormCard"
        hidden
      >

        <h2>Add Reminder</h2>


        <form
          id="reminderForm"
          onsubmit="event.preventDefault(); addReminder();"
        >

          <div class="form-grid">


            <div class="form-group">

              <label for="reminderTitle">
                Reminder
              </label>

              <input
                id="reminderTitle"
                type="text"
                placeholder="What do you need to remember?"
                required
              >

            </div>


            <div class="form-group">

              <label for="reminderDate">
                Date
              </label>

              <input
                id="reminderDate"
                type="date"
                required
              >

            </div>


            <div class="form-group">

              <label for="reminderTime">
                Time
              </label>

              <input
                id="reminderTime"
                type="time"
              >

            </div>

          </div>


          <div class="form-actions">

            <button
              type="submit"
              class="primary-button"
            >
              Add Reminder
            </button>

            <button
              type="button"
              class="secondary-button"
              onclick="hideReminderForm()"
            >
              Cancel
            </button>

          </div>

        </form>

      </div>


      <!-- REMINDER LIST -->

      <div class="card">

        <div class="section-header">

          <h2>Reminders</h2>

          <button
            type="button"
            class="section-action"
            onclick="showReminderForm()"
          >
            + Add Reminder
          </button>

        </div>

        <div
          id="reminderList"
          class="reminder-list"
        ></div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    <div class="container">
      Planning Dashboard
    </div>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="app.js"></script>

</body>

</html>
